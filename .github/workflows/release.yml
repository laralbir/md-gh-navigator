name: Release & Distribution Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release Binaries & Checksums
        run: ./gradlew assembleRelease bundleRelease generateReleaseChecksums --stacktrace

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "Extracting release notes for $TAG_NAME..."
          python3 -c "
          import re, sys

          tag = '$TAG_NAME'
          version = '$VERSION'
          with open('docs/CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Match ## [vX.Y.Z] or ## [X.Y.Z] section
          pattern = r'## \[(?:v)?' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = f'Release {tag} - MD GitHub Navigator'

          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes + '\n')
          "
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          name: "MD GitHub Navigator ${{ github.ref_name }}-beta (Beta)"
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.sha256
            docs/assets/store/*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
